    to: String!
    """Message body shown above the call button. **Required.**"""
    bodyText: String!
    """
    Custom label for the call button. Defaults to Meta's standard "Call" label if omitted.
    """
    displayText: String
    """How long the call button stays actionable, in minutes."""
    ttlMinutes: Int
    """
    Opaque payload echoed back when the customer taps the button (for tracking).
    """
    payload: String
  ): JSON
  """
  Send an interactive message asking the customer to grant calling permission,
  required before the business can call them under Meta's calling rules.
  
  <Note>
  **Side effects:** Creates one outbound interactive message. Check the result with [`whatsappGetCallPermission`](/api-reference/queries/whatsappGetCallPermission).
  </Note>
  
  <small>
  
  *Auth* · `x-app-token` · required permission `conversationMessageAdd`
  
  *Related:* [`whatsappGetCallPermission`](/api-reference/queries/whatsappGetCallPermission), [Authentication](/developers/getting-started/authentication)
  
  </small>
  """
  whatsappSendCallPermissionRequest(
    """Sending WhatsApp integration id. **Required.**"""
    integrationId: String!
    """Destination phone number (E.164). **Required.**"""
    to: String!
    """
    Message body explaining the permission request. Uses a default if omitted.
    """
    bodyText: String
  ): JSON
  """
  Push/refresh the workspace's product catalog to Meta's Commerce Catalog for
  this integration, so products can be tagged in messages and orders.
  
  <Warning>
  Subject to a **15-minute cooldown per WABA** — calling again too soon is rejected. Check [`whatsappCatalogSyncStatus`](/api-reference/queries/whatsappCatalogSyncStatus) before retrying.
  </Warning>
  
  <small>
  
  *Auth* · `x-app-token` · required permission `integrationsEdit`
  
  *Related:* [`whatsappCatalogSyncStatus`](/api-reference/queries/whatsappCatalogSyncStatus), [`whatsappCatalogPermissionStatus`](/api-reference/queries/whatsappCatalogPermissionStatus), [Authentication](/developers/getting-started/authentication)
  
  </small>
  """
  whatsappSyncCatalogProducts(
    """WhatsApp integration id. **Required.**"""
    integrationId: String!
  ): JSON
}

