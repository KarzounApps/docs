"""
One execution run of an [`Automation`](/api-reference/types/Automation), from the trigger firing to
completion, failure, or waiting.

<Info>
`status` `waiting` means the run is paused mid-flow (e.g. on a delay or
input step) and will resume automatically at `resumeAt` / `nextNodeNs`.
</Info>
"""
type AutomationHistory {
  """Unique execution history document id."""
  _id: String
  """
  Execution engine's run id — stable across `waiting`/resume cycles for the same run.
  """
  executionId: String
  """Namespace of the automation that ran."""
  automationNs: String
  """Namespace of the trigger that started this run."""
  triggerNs: String
  """Trigger `type` at the time this run started."""
  triggerType: String
  """Trigger `event` at the time this run started."""
  triggerEvent: String
  """Id of the entity the run acted on (typically a customer/conversation)."""
  targetId: String
  """Type of `targetId` (e.g. `customer`)."""
  targetType: String
  """
  Run status: `running`, `completed`, `failed`, `waiting`, or `archived`.
  """
  status: String
  """When the run started."""
  startedAt: Date
  """When the run finished, if it has."""
  completedAt: Date
  """Total run duration in milliseconds, once completed."""
  duration: Int
  """Node the run is paused at, when `status` is `waiting`."""
  waitingNodeNs: String
  """Why the run is paused (e.g. `delay`, `awaitingInput`)."""
  waitingReason: String
  """When a `waiting` run is scheduled to resume, if time-based."""
  resumeAt: Date
  """Number of nodes executed so far in this run."""
  nodeCount: Int
  """Failure detail, when `status` is `failed`."""
  errorMessage: String
  """Last time this history document changed."""
  modifiedAt: Date
  """
  Parent run's `executionId`, when this run was spawned by another (e.g. a sub-flow).
  """
  parentExecutionId: String
  """
  Per-node execution trace — see [`ExecutionStep`](/api-reference/types/ExecutionStep). Populated in full on [`AutomationHistoryDetail`](/api-reference/types/AutomationHistoryDetail).
  """
  steps: [ExecutionStep]
  """Target customer's phone, denormalized for display."""
  customerPhone: String
  """Target customer's name, denormalized for display."""
  customerName: String
}

