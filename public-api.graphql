"""
A **segment-v2** definition — a saved audience rule (static or dynamic)
used to target customers for campaigns and automations.

Segments are versioned: a published [`SegmentV2`](/api-reference/types/SegmentV2) has an
`activeVersion` serving reads, while [`segmentV2SaveDraft`](/api-reference/mutations/segmentV2SaveDraft)
stages an unpublished `draftVersion`. Rebuilds are asynchronous — check
`readyForCampaign` or call [`segmentV2AssertReadyForCampaign`](/api-reference/queries/segmentV2AssertReadyForCampaign)
before targeting.

<Info>
This is a read-only shadow surface (`SEGMENTS_V2_ENABLED`) — behavior may change before general availability.
</Info>
"""
type SegmentV2 {
  """Unique segment identifier."""
  _id: String!
  """Owning workspace/tenant id."""
  tenantId: String!
  """Display name shown in segment pickers."""
  name: String!
  """Optional free-text description."""
  description: String
  """
  Lifecycle status (e.g. active, archived). See [`segmentV2Archive`](/api-reference/mutations/segmentV2Archive) / [`segmentV2Unarchive`](/api-reference/mutations/segmentV2Unarchive).
  """
  status: String!
  """
  Segment kind — static (explicit member list) or dynamic (rule-evaluated).
  """
  type: String!
  """Version number currently serving reads and campaign targeting."""
  activeVersion: Int!
  """
  Unpublished version staged by [`segmentV2SaveDraft`](/api-reference/mutations/segmentV2SaveDraft).
  `null` when there is no pending draft.
  """
  draftVersion: Int
  """
  Version currently being rebuilt, if any.
  Non-null means membership counts may be stale until the rebuild completes.
  """
  buildingVersion: Int
  """
  Internal keys this segment's rule depends on (e.g. referenced fields/segments).
  """
  dependencyKeys: [String]
  """
  Rebuild/evaluation state. See [`SegmentV2EvaluatorState`](/api-reference/types/SegmentV2EvaluatorState).
  """
  evaluator: SegmentV2EvaluatorState
  """
  How this segment is currently used (e.g. campaign targeting, general purpose).
  """
  usageState: String!
  """Timestamp of the last time membership was read."""
  lastReadAt: Date
  """
  When `true`, membership enter/exit changes emit events for downstream
  automations. Set via [`segmentV2SaveDraft`](/api-reference/mutations/segmentV2SaveDraft).
  """
  emitsMembershipEvents: Boolean!
  """User id that created this segment."""
  createdBy: String
  """When this segment was created."""
  createdAt: Date
  """User id of the last editor."""
  updatedBy: String
  """When this segment was last modified."""
  updatedAt: Date
  """
  `true` when the segment has a published active version and is not
  currently rebuilding. Prefer [`segmentV2AssertReadyForCampaign`](/api-reference/queries/segmentV2AssertReadyForCampaign)
  when checking multiple segments before launching a campaign.
  """
  readyForCampaign: Boolean
}

"""
Active-version member count returned by [`segmentV2Count`](/api-reference/queries/segmentV2Count).
"""
type SegmentV2Count {
  """Version the count was computed against."""
  segmentVersion: Int!
  """Number of active members."""
  count: Int!
}

"""
Rebuild/evaluation state for a [`SegmentV2`](/api-reference/types/SegmentV2) (shadow rollout,
gated by `SEGMENTS_V2_ENABLED`).

Poll `nextScheduledAt` / `lastFullEvalAt` before relying on membership
freshness, or use [`segmentV2AssertReadyForCampaign`](/api-reference/queries/segmentV2AssertReadyForCampaign) before
targeting a campaign.
"""
type SegmentV2EvaluatorState {
  """Rebuild strategy for this segment (e.g. full vs incremental)."""
  refreshMode: String
  """Timestamp of the last full membership rebuild."""
  lastFullEvalAt: Date
  """Timestamp of the last incremental membership update."""
  lastIncrementalAt: Date
  """Timestamp of the next scheduled rebuild. `null` when none is queued."""
  nextScheduledAt: Date
  """How time-based rule conditions decay membership over time."""
  timeDecayStrategy: String
  """Minutes between scheduled full rebuilds."""
  fullRefreshCadenceMinutes: Int
  """Rebuild scheduling priority relative to other segments."""
  priorityTier: String
}

