}

"""
One-time create payload from [`appsAdd`](/api-reference/mutations/appsAdd).

<Danger>
Store `accessToken` immediately — it is shown **once**. Later [`apps`](/api-reference/queries/apps) / [`appDetail`](/api-reference/queries/appDetail) only return a `****last4` hint on [`App`](/api-reference/types/App). Rotate by creating a new app, then disable and [`appsRemove`](/api-reference/mutations/appsRemove) the old one.
</Danger>
"""
type AppTokenResult {
  """
  Id of the newly created app (same as [`App`](/api-reference/types/App).`_id`).
