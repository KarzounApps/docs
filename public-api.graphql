type Mutation {
  """
  Create a new automation. Always created as `status: draft` with a fresh,
  randomly generated `ns`.
  
  <small>
  
  *Auth* · `x-app-token` · required permission `automationsAdd`
  
  *Related:* [`automationsEdit`](/api-reference/mutations/automationsEdit), [`automationsPublish`](/api-reference/mutations/automationsPublish), [`Automation`](/api-reference/types/Automation)
  
  </small>
  """
  automationsAdd(
    """Display name."""
    name: String
    """Initial status. Almost always omit — new automations start as `draft`."""
    status: String
    """Do not set on create — reserved for internal draft-of-live linkage."""
    draftOf: String
    """
    Existing trigger ids to attach. Usually omitted — add triggers after creation with [`triggersAdd`](/api-reference/mutations/triggersAdd).
    """
    triggers: [String]
    """
    Existing node ids to attach. Usually omitted — add nodes after creation with [`nodesAdd`](/api-reference/mutations/nodesAdd).
    """
    nodes: [String]
    """Namespace of the first node to run. Set once nodes exist."""
    startNodeNs: String
    """Initial tag ids."""
    tagIds: [String]
  ): Automation
  """
  Publish a draft, making it the new **live** version of its automation family.
  
  <Warning>
  The previously live version becomes an archived `version` snapshot
  (oldest snapshots beyond the last 50 are pruned). Broken nodes referencing
  unresolved PAF import entities **block publish** — resolve them first with
  [`automationsReconcileImportIssues`](/api-reference/mutations/automationsReconcileImportIssues).
  </Warning>
  
  <Note>
  **Errors:** `Draft Automation not found`; publish fails if unresolved
  broken nodes remain after reconciliation.
  </Note>
  
  <small>
  
  *Auth* · `x-app-token` · required permission `automationsEdit`
  
  *Related:* [`automationsDiscardDraft`](/api-reference/mutations/automationsDiscardDraft), [`automationsRevert`](/api-reference/mutations/automationsRevert), [`automationVersions`](/api-reference/queries/automationVersions)
  
  </small>
  """
  automationsPublish(_id: String!): Automation
  """
  Re-check pending WhatsApp templates/flows referenced by a PAF import and
  heal any nodes that are now ready.
  
  <small>
  
  *Auth* · `x-app-token` · required permission `automationsEdit`
  
  *Related:* [`automationImportFromPAF`](/api-reference/mutations/automationImportFromPAF), [`automationsPublish`](/api-reference/mutations/automationsPublish)
  
  </small>
  """
  automationsReconcileImportIssues(_id: String!): ImportIssueReconcileResult
  """
  Discard a draft and its nodes/triggers, keeping the live version untouched.
  
  <Warning>
  Only works on drafts with a `draftOf` reference (edits of a live
  automation). For a workspace-new automation that was never published, use
  [`archiveAutomations`](/api-reference/mutations/archiveAutomations) instead.
  </Warning>
  
  <small>
  
  *Auth* · `x-app-token` · required permission `automationsEdit`
  
  *Related:* [`draftAutomationDetail`](/api-reference/mutations/draftAutomationDetail), [`automationsPublish`](/api-reference/mutations/automationsPublish)
  
  </small>
  """
  automationsDiscardDraft(_id: String!): JSON
  """
  Fetch (creating on first call) the editable draft for a live automation.
  
  If a draft already exists for `_id`, returns it with its `nodes`/`triggers`
  resolved. Otherwise deep-clones the live automation into a new draft sharing
  the same `ns`.
  
  <small>
  
  *Auth* · `x-app-token` · required permission `automationsEdit`
  
  *Related:* [`automationsPublish`](/api-reference/mutations/automationsPublish), [`automationsDiscardDraft`](/api-reference/mutations/automationsDiscardDraft), [`Automation`](/api-reference/types/Automation)
  
  </small>
  """
  draftAutomationDetail(_id: String!): Automation
  """
  Create a node and attach it to its parent automation.
  
