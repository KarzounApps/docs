  pageTitle: String
  """Device/browser metadata. Populated for `behavioral` entries."""
  device: JSON
  """Attribution/campaign metadata. Populated for `behavioral` entries."""
  campaign: JSON
  """Custom event properties. Populated for `behavioral` entries."""
  properties: JSON
