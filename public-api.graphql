  data: [ConversationMessage]
  """Pagination metadata."""
  pagination: PaginationInfo!
}

"""
Status of a conversation in the inbox.
Determines the conversation's workflow state and visibility.
"""
enum ConversationStatus {
  """Conversation is actively being handled"""
  open
  """Conversation has been resolved and closed"""
  closed
  """Conversation is on hold, awaiting customer action"""
  pending
  """Conversation is snoozed until a later time, awaiting team action"""
  snoozed
  """Conversation currently handled by the automation bot/ai agents"""
  bot
  """Conversations that was never closed/reopned"""
  new
}

