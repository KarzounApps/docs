"""
Union type for all action payloads.
"""
union ActionsPayload =
  | AssignedPayload
  | UnassignedPayload
  | StatusChangedPayload
  | TaggedPayload
  | UntaggedPayload
  | TagsChangedPayload
  | ParticipantAddedPayload
  | ParticipantRemovedPayload
  | ConvertedToCardPayload
  | PriorityChangedPayload

