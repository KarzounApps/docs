"""
An **automation** — a workflow made of [`Trigger`](/api-reference/types/Trigger)s (entry points)
and [`Node`](/api-reference/types/Node)s (steps) connected on a canvas.

Automations move through statuses: `draft` → `live` (or `offline`) → `archived`,
with past `version` snapshots kept after each [`automationsPublish`](/api-reference/mutations/automationsPublish).
Editing a live automation creates a separate **draft** copy (`draftOf` points at
the live `_id`) so in-progress edits never affect what is currently running.

<Info>
`hasDraft` (on [`automationsMain`](/api-reference/queries/automationsMain) rows) tells you whether a live
automation has an in-progress draft — use [`draftAutomationDetail`](/api-reference/mutations/draftAutomationDetail)
to open or create it.
</Info>
"""
type Automation {
  """
  Unique identifier for this automation document (one per version/draft).
  """
  _id: String!
  """
  Stable namespace shared by the live automation, its versions, and its draft.
  Use this — not `_id` — to address "the automation" across edits with
  [`automationByNs`](/api-reference/queries/automationByNs) / [`automationDetailByNs`](/api-reference/queries/automationDetailByNs).
  """
  ns: String
  """Display name shown in the automation list and builder."""
  name: String
  """
  One of `draft`, `live`, `offline`, `archived`, `template`, or `version` (a
  past published snapshot). [`automations`](/api-reference/queries/automations) / [`automationsMain`](/api-reference/queries/automationsMain)
  exclude `version`, `archived`, and `template` by default unless `status` is
  passed explicitly.
  """
  status: String
  """
  Set only on draft copies of a live automation — the `_id` of that live automation.
  Absent on brand-new (never-published) drafts.
  """
  draftOf: String
  """
  Whether a live/offline automation currently has an in-progress draft.
  Populated by [`automationsMain`](/api-reference/queries/automationsMain) only.
  """
  hasDraft: Boolean
  """When this document was created."""
  createdAt: Date
  """When this document was last modified."""
  updatedAt: Date
  """User id who created this document."""
  createdBy: String
  """User id who last modified this document."""
  updatedBy: String
  """Resolved creator — see `createdBy`."""
  createdUser: User
  """Resolved last editor — see `updatedBy`."""
  updatedUser: User
  """
  Entry-point [`Trigger`](/api-reference/types/Trigger)s wired into this automation.
  """
  triggers: [Trigger]
  """Step [`Node`](/api-reference/types/Node)s wired into this automation."""
  nodes: [Node]
  """Namespace of the first node executed after a trigger fires."""
  startNodeNs: String
  """
  Tag ids on this automation family. Set via [`automationsSetTags`](/api-reference/mutations/automationsSetTags).
  """
  tagIds: [String]
  """Resolved tags — see `tagIds`."""
  tags: [Tag]
  """
  Description shown in the templates gallery. Set by [`automationsSaveAsTemplate`](/api-reference/mutations/automationsSaveAsTemplate).
  """
  templateDescription: String
  """
  Category shown in the templates gallery. Set by [`automationsSaveAsTemplate`](/api-reference/mutations/automationsSaveAsTemplate).
  """
  templateCategory: String
  """
  Version number, incremented on every [`automationsPublish`](/api-reference/mutations/automationsPublish).
  `1` on first publish; absent on drafts that have never gone live.
  """
  version: Int
  """Timestamp of the most recent publish."""
  publishedAt: Date
  """User id who most recently published this automation."""
  publishedBy: String
  """
  Timestamp this document was archived — set both when a past `version` is
  superseded by a new publish, and when [`archiveAutomations`](/api-reference/mutations/archiveAutomations) archives
  the whole automation.
  """
  archivedAt: Date
  """
  Status to restore to via [`archiveAutomations`](/api-reference/mutations/archiveAutomations)`(isRestore: true)`.
  Only set while `status` is `archived`.
  """
  previousStatus: String
}

