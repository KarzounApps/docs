"""
Tag used for categorizing entities across the system.
"""
type Tag {
  _id: String!
  name: String
  type: String
  colorCode: String
  createdAt: Date
  objectCount: Int
  totalObjectCount: Int
  parentId: String
  order: String
  relatedIds: [String]
  childTags: [Tag]
}

"""
Payload for tagged action.
"""
type TaggedPayload {
  tagName: String
}

"""
Payload for tags_changed action.
"""
type TagsChangedPayload {
  addedTagIds: [String]
  removedTagIds: [String]
  performedBy: String
  viaAutomation: Boolean
  """
  Resolved user who performed the tags change.
  """
  performedByUser: User
}

type TagsPaginatedResponse {
  data: [Tag!]!
  pagination: PaginationInfo!
}

"""
Rendered snapshot of a template message.
"""
type TemplateRendered {
  header: TemplateRenderedHeader
  body: String
  footer: String
  buttons: [TemplateRenderedButton]
  carousel: [TemplateRenderedCarouselCard]
  lto: TemplateRenderedLTO
}

type TemplateRenderedButton {
  type: String
  text: String
  url: String
  phone_number: String
  coupon_code: String
}

type TemplateRenderedCarouselCard {
  header: TemplateRenderedHeader
  body: String
  buttons: [TemplateRenderedButton]
}

type TemplateRenderedHeader {
  type: String
  text: String
  url: String
  product_retailer_id: String
  catalog_id: String
  latitude: Float
  longitude: Float
  name: String
  address: String
}

type TemplateRenderedLTO {
  expiration_time_ms: Float
}

type Throughput {
  level: String
}

"""
Payload for unassigned action.
"""
type UnassignedPayload {
  assignedTo: String
  assignedUserId: String
  assignedDepartmentId: String
  assignedBy: String
  performedBy: String
  """
  Resolved user who was unassigned from.
  """
  assignedToUser: User
  """
  Resolved user who was unassigned (by assignedUserId).
  """
  assignedUser: User
  """
  Resolved user who performed the unassignment.
  """
  assignedByUser: User
  """
  Resolved user who performed the action.
  """
  performedByUser: User
  """
  Resolved department the conversation was unassigned from.
  """
  assignedDepartment: Department
}

"""
Payload for untagged action.
"""
type UntaggedPayload {
  tagName: String
}

"""
Team member account with permissions, preferences, and structure assignments.
"""
type User {
  _id: String!
  createdAt: Date
  username: String
  email: String
  userPreferences: JSON
  availability: UserChatStatus
  isActive: Boolean
  details: UserDetailsType
  links: JSON
  status: String
  emailSignatures: JSON
  groupIds: [String]
  workspaceIds: [String]
  isSubscribed: String
  customFieldsData: JSON
  workspaces: [Workspace]
  isOwner: Boolean
  permissionActions: JSON
  configs: JSON
  configsConstants: [JSON]
  onboardingHistory: OnboardingHistory
  departmentIds: [String]
  departments: [Department]
  branchIds: [String]
  branches: [Branch]
  positionIds: [String]
  positions: [Position]
  score: Float
  scoreCategories: ScoreCategories
  leaderBoardPosition: Int
  employeeId: String
  isOnline: Boolean
}

"""
Presence state used for routing conversations and workload.
"""
enum UserChatStatus {
  """
  User is offline or signed out.
  """
  offline
  """
  User is available for new work.
  """
  online
  """
  User is active but prefers no new assignments.
  """
  busy
  """
  User is on a break and should not receive new work.
  """
  break
}

type UserDetailsType {
  """
  Profile avatar URL.
  """
  avatar: String
  """
  Cover photo or header background.
  """
  coverPhoto: String
  """
  Full display name used in the UI.
  """
  fullName: String
  """
  Short name or nickname.
  """
  shortName: String
  """
  Birth date; used for anniversaries.
  """
  birthDate: Date
  """
  Job title or position.
  """
  position: String
  """
  Employment start date.
  """
  workStartedDate: Date
  """
  Primary working location.
  """
  location: String
  """
  Short bio or description.
  """
  description: String
  """
  Direct phone number for operators.
  """
  operatorPhone: String
  """
  Given name.
  """
  firstName: String
  """
  Family name.
  """
  lastName: String
  """
  Internal employee identifier.
  """
  employeeId: String
}

"""
Paginated response wrapper for user list queries.
"""
type UserListResponse {
  data: [User]
  pagination: PaginationInfo!
}

"""
Option selection on a specific variant.
"""
type VariantOptionValue {
  optionId: String!
  optionName: String!
  valueId: String!
  value: String!
}

"""
A shared contact from a WhatsApp contacts message.
"""
type WAContact {
  """
  Contact name.
  """
  name: WAContactName
  """
  Phone numbers.
  """
  phones: [JSON]
  """
  Email addresses.
  """
  emails: [JSON]
  """
  URLs.
  """
  urls: [JSON]
  """
  Organization info.
  """
  org: JSON
  """
  Birthday (YYYY-MM-DD).
  """
  birthday: String
  """
  Postal addresses.
  """
  addresses: [JSON]
}

"""
A contact name structure (vCard-like).
"""
type WAContactName {
  """
  Full formatted name.
  """
  formatted_name: String
  """
  First name.
  """
  first_name: String
  """
  Last name.
  """
  last_name: String
  """
  Middle name.
  """
  middle_name: String
  """
  Name prefix (e.g. 'Dr.').
  """
  prefix: String
  """
  Name suffix (e.g. 'Jr.').
  """
  suffix: String
}

"""
Location message content.
"""
type WALocation {
  """
  Latitude.
  """
  latitude: Float
  """
  Longitude.
  """
  longitude: Float
  """
  Location name/label.
  """
  name: String
  """
  Street address.
  """
  address: String
  """
  URL to open in maps.
  """
  url: String
}

"""
WhatsApp ad referral data (click-to-WhatsApp ads).
"""
type WAReferral {
  """
  Source URL of the ad.
  """
  source_url: String
  """
  Source type (e.g. 'ad').
  """
  source_type: String
  """
  Source identifier.
  """
  source_id: String
  """
  Ad headline text.
  """
  headline: String
  """
  Ad body text.
  """
  body: String
  """
  Media type of the ad ('image' or 'video').
  """
  media_type: String
  """
  Image URL from the ad.
  """
  image_url: String
  """
  Video URL from the ad.
  """
  video_url: String
  """
  Thumbnail URL from the ad.
  """
  thumbnail_url: String
  """
  Meta click ID for CTWA attribution.
  """
  ctwa_clid: String
  """
  Greeting configured on the ad.
  """
  welcome_message: WAReferralWelcomeMessage
  """
  Welcome Message Sequence reference from partner-app CTWA ads.
  """
  ref: String
  """
  Sequence name resolved locally from ref.
  """
  sequence_name: String
}

"""
Greeting text attached to a CTWA ad referral.
"""
type WAReferralWelcomeMessage {
  """
  Greeting text shown to the customer.
  """
  text: String
}

"""
Sticker message content.
"""
type WASticker {
  """
  Media ID.
  """
  id: String
  """
  Direct link to the sticker file.
  """
  link: String
  """
  Resolved URL for the sticker.
  """
  url: String
  """
  MIME type (e.g. 'image/webp').
  """
  mime_type: String
  """
  SHA-256 hash.
  """
  sha256: String
  """
  Whether this is an animated sticker.
  """
  animated: Boolean
}

type WhatsappBusinessPhone {
  id: String
  status: String
  quality_rating: String
  platform_type: String
  whatsappBusinessManagerMessagingLimit: String
  messaging_limit_tier: String
  is_pin_enabled: Boolean
  display_phone_number: String
  name_status: String
  account_mode: String
  is_official_business_account: Boolean
  code_verification_status: String
  verified_name: String
  new_name_status: String
  throughput: Throughput
  health_status: WhatsappHealthStatus
}

type WhatsappBusinessProfile {
  about: String
  email: String
  description: String
  websites: [String]
  vertical: String
  address: String
  messaging_product: String
  profile_picture_url: String
  status: String!
  error: String
}

type WhatsappHealthStatus {
  can_send_message: String
  entities: [HealthEntity]
}

type WhatsappIntegration {
  _id: String!
  accountId: String
  kind: String
  provider: String
  phoneNumberId: String
  wabaId: String
  error: String
  healthStatus: String
  accountMode: String
  profile: WhatsappBusinessProfile
  businessPhoneNumber: WhatsappBusinessPhone
}

"""
Workspace entity used for multi-workspace configurations (email, assets, member assignments).
"""
type Workspace {
  _id: String!
  name: String
  description: String
  code: String
  userId: String
  createdAt: Date
  memberIds: [String]
}
