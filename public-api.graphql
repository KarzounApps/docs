"""
An **app credential** (API token) for the Karzoun public GraphQL API.

Use apps to authenticate server-side integrations, MCP clients, and automations
with the `x-app-token` header. Scope is chosen at creation — either a user
group or full access via `allowAllPermission`. See [Authentication](/developers/getting-started/authentication).

<Warning>
`accessToken` on [`App`](/api-reference/types/App) is a **hint only** (`****` + last 4 characters). The full JWT is returned once from [`appsAdd`](/api-reference/mutations/appsAdd) → [`AppTokenResult`](/api-reference/types/AppTokenResult).
</Warning>
"""
type App {
  """Unique app identifier."""
  _id: String
  """
  Whether the app can authenticate API requests.
  Must be `false` before [`appsRemove`](/api-reference/mutations/appsRemove) succeeds.
  """
  isEnabled: Boolean
  """When this credential was created."""
  createdAt: Date
  """
  Timestamp of the last successful authentication with this token.
  `null` if the token has never been used — useful when rotating idle credentials.
  """
  lastUsedAt: Date
  """
  Display name in the Developer dashboard and [`apps`](/api-reference/queries/apps) search.
  """
  name: String
  """
  User group that defines this app's permissions.
  Empty when `allowAllPermission` is true.
  **Locked after creation** — mint a new app with [`appsAdd`](/api-reference/mutations/appsAdd) to change scope.
  """
  userGroupId: String
  """
  Workspace this app belongs to (multi-workspace tenants).
  Usually inherited from the authenticated context.
  """
  workspaceId: String
  """
  JWT expiry when `noExpire` is false.
  Ignored when `noExpire` is true.
  """
  expireDate: Date
  """
  When true, the app inherits full workspace permissions (owner-like).
  Prefer a least-privilege user group via `userGroupId` for production.
  **Locked after creation.**
  """
  allowAllPermission: Boolean
  """
  When true, the JWT does not expire (still revoke with [`appsRemove`](/api-reference/mutations/appsRemove)).
  When false, set `expireDate`.
  """
  noExpire: Boolean
  """
  Masked hint for identification: `****` + last 4 characters (e.g. `****a1b2`).
  Not a usable JWT — capture the full token only from [`appsAdd`](/api-reference/mutations/appsAdd) →
  [`AppTokenResult`](/api-reference/types/AppTokenResult).`accessToken`.
  """
  accessToken: String
  """
  Resolved display name for `userGroupId`. Falls back to a full-access label when allow-all.
  """
  userGroupName: String
}

"""
Paginated list of app credentials for the current workspace.

